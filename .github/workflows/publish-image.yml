name: Publish API image

# Builds the x86 server image and pushes it to GitHub Container Registry, where the
# Pterodactyl server pulls it: ghcr.io/lavishsphere/patchlane-api:latest
on:
  push:
    branches: [main]
    paths:
      - backend/**
      - demo/**
      - .dockerignore
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64  # both servers are x86 with AVX2
          push: true
          tags: |
            ghcr.io/lavishsphere/patchlane-api:latest
            ghcr.io/lavishsphere/patchlane-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
